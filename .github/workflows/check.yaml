name: Check

on:
  push:
    branches:
      - beta
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - review_requested

concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  check-quick:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Check: Astro'
            command: pnpm run check:astro
          - name: 'Test: Vitest'
            command: pnpm run check:vitest
          - name: 'Lint: ESLint'
            command: pnpm run check:lint
          - name: 'Format: Prettier'
            command: pnpm run check:syntax
          - name: 'Spell check: CSpell'
            command: pnpm run check:spelling:quiet
          - name: Other checks
            command: pnpm run check:misc
          - name: 'Build: Astro'
            command: pnpm run check:build:post:quiet
          - name: Commit signature
            command: bash tests/signed-commit.test.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install packages
        if: matrix.name != 'Commit signature'
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install pnpm
        if: matrix.name != 'Commit signature'
        uses: pnpm/action-setup@v6.1.1
      - name: Install Node.js
        if: matrix.name != 'Commit signature'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        if: matrix.name != 'Commit signature'
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
        env:
          WALLETBEAT_ENV: CI
  check-full:
    name: 'Run all CI tests'
    runs-on: ${{ matrix.os }}
    needs:
      - check-quick
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install macOS packages
        if: runner.os == 'macOS'
        uses: ./.github/actions/install-macos-packages
      - name: Install packages (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./deploy/install-windows-packages.sh
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all checks
        run: pnpm run check:ci
