name: Check

on:
  push:
    # Pushes to PR branches are already covered by the `synchronize` event
    # below; only the trunk needs its own push trigger.
    branches:
      - beta
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - review_requested

# Supersede in-flight runs for the same PR. Give every trunk commit its own
# group so that each one receives a recorded result.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-quick:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Check: Astro'
            command: pnpm run check:astro
          - name: 'Test: Vitest'
            command: pnpm run check:vitest
          - name: 'Lint: ESLint'
            command: pnpm run check:lint
          - name: 'Format: Prettier'
            command: pnpm run check:syntax
          - name: 'Spell check: CSpell'
            command: pnpm run check:spelling:quiet
          - name: Other checks
            command: pnpm run check:misc
          - name: 'Build: Astro'
            command: pnpm run check:build:post:quiet
          - name: Commit signature
            command: pnpm run check:signed-commit
          - name: Wallet metadata freshness
            command: pnpm run check:wallet-metadata-update
            # Diffs against the PR base ref, so it needs full history and only
            # makes sense on pull_request events.
            fetchDepth: 0
            pullRequestOnly: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: ${{ matrix.fetchDepth || 1 }}
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.name }}
        if: matrix.pullRequestOnly != true || github.event_name == 'pull_request'
        run: ${{ matrix.command }}
        env:
          WALLETBEAT_ENV: CI
  check-full:
    name: 'Run all CI tests'
    runs-on: ${{ matrix.os }}
    needs:
      - check-quick
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - name: Install packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install packages (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask $(cat deploy/macos-packages.txt)
      - name: Install packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install $(cat deploy/windows-packages.txt) -y
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all checks
        run: pnpm run check:ci
