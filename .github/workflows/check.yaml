name: Check

on:
  push: {}
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review
      - review_requested

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Check – Astro
            command: pnpm run check:astro
          - name: Test – Vitest
            command: pnpm run check:vitest
          - name: Lint – ESLint
            command: pnpm run check:lint
          - name: Format – Prettier
            command: pnpm run check:syntax
          - name: Spell check – CSpell
            command: pnpm run check:spelling:quiet
          - name: Other checks
            command: pnpm run check:misc
          - name: Build – Astro
            command: pnpm run check:build:post:quiet
          - name: Commit signature
            command: pnpm run check:signed-commit
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  # Kept out of the `check` matrix above: this is the only check that needs full
  # history, and a matrix-driven `fetch-depth` cannot express 0 (every
  # `x && 0 || 1` form collapses to 1, because 0 is falsy in GHA expressions).
  wallet-metadata:
    name: Wallet metadata freshness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          # Needed so the base commit is present to diff against.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wallet metadata freshness
        # `actions/checkout` fetches only the PR merge ref, so no `origin/<branch>`
        # tracking ref exists; name the base by SHA instead.
        run: pnpm run check:wallet-metadata-update -- --base ${{ github.event.pull_request.base.sha }}
