name: Check

on:
  push:
    # Pushes to PR branches are already covered by the `synchronize` event
    # below; only the trunk needs its own push trigger.
    branches:
      - beta
  pull_request:
    types:
      - opened
      - reopened
      - edited # Filtered down to base-branch changes; see `check-quick`.
      - synchronize
      - ready_for_review
      - review_requested

# Supersede in-flight runs for the same PR (or the same branch, for pushes),
# but never cancel a run on the trunk.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/beta' }}

jobs:
  check-quick:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # `edited` fires for title, body and base-branch changes alike, and GitHub
    # offers no way to subscribe to only the last one. Title and body edits
    # cannot affect the result of any check here, so skip those runs; a
    # base-branch change alters the merge commit under test, so keep those.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Check: Astro'
            command: pnpm run check:astro
          - name: 'Test: Vitest'
            command: pnpm run check:vitest
          - name: 'Lint: ESLint'
            command: pnpm run check:lint
          - name: 'Format: Prettier'
            command: pnpm run check:syntax
          - name: 'Spell check: CSpell'
            command: pnpm run check:spelling:quiet
          - name: Other checks
            command: pnpm run check:misc
          - name: 'Build: Astro'
            command: pnpm run check:build:post:quiet
          - name: Commit signature
            command: pnpm run check:signed-commit
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
        env:
          WALLETBEAT_ENV: CI
  check-full:
    name: 'Run all CI tests'
    runs-on: ubuntu-latest
    needs:
      - check-quick
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all checks
        run: pnpm run check:ci
