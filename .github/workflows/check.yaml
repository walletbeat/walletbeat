name: Check

on:
  push: {}
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review
      - review_requested

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Check – Astro
            command: pnpm run check:astro
          - name: Test – Vitest
            command: pnpm run check:vitest
          - name: Lint – ESLint
            command: pnpm run check:lint
          - name: Format – Prettier
            command: pnpm run check:syntax
          - name: Spell check – CSpell
            command: pnpm run check:spelling:quiet
          - name: Other checks
            command: pnpm run check:misc
          - name: Build – Astro
            command: pnpm run check:build:post:quiet
          - name: Commit signature
            command: pnpm run check:signed-commit
          - name: Wallet metadata freshness
            # `actions/checkout` creates no `origin/<branch>` tracking ref, so the
            # base has to be named by SHA. At fetch-depth 0 the base commit is in
            # the fetched history, so it resolves locally.
            command: pnpm run check:wallet-metadata-update -- --base ${{ github.event.pull_request.base.sha }}
            fetchDepth: 0
            pullRequestOnly: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: ${{ matrix.fetchDepth || 1 }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.name }}
        if: matrix.pullRequestOnly != true || github.event_name == 'pull_request'
        run: ${{ matrix.command }}
