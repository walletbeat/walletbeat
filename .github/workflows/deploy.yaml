name: Deploy

on:
  push:
    branches:
      - beta

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Check – Astro
            command: pnpm run check:astro
          - name: Test – Vitest
            command: pnpm run check:vitest
          - name: Lint – ESLint
            command: pnpm run check:lint
          - name: Format – Prettier
            command: pnpm run check:syntax
          - name: Spell check – CSpell
            command: pnpm run check:spelling:quiet
          - name: Validate
            command: pnpm run check:misc
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  build:
    name: Build – Astro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and run post-build checks
        run: pnpm run check:build:post:quiet
      - name: Upload dist
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy-orbiter:
    name: Deploy – Orbiter
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - name: Deploy to Orbiter
        run: ./deploy/deploy-orbiter.sh
        env:
          ORBITER_DOMAIN: walletbeat-beta
          ORBITER_ACCESS_TOKEN: ${{ secrets.ORBITER_ACCESS_TOKEN }}
          ORBITER_ACCESS_TOKEN_CREATION_DATE: ${{ secrets.ORBITER_ACCESS_TOKEN_CREATION_DATE }}
          DEPLOY_DIRECTORY: dist

  pin-4everland:
    name: Pin to IPFS – Omnipin
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - name: Pin on 4EVERLAND
        run: ./deploy/pin-omnipin.sh
        env:
          DEPLOY_DIRECTORY: dist
          OMNIPIN_4EVERLAND_TOKEN: ${{ secrets.BETA_WALLETBEAT_ETH_4EVERLAND_ACCESS_TOKEN }}

  publish-ens:
    name: Publish ENS records – Omnipin
    runs-on: ubuntu-latest
    needs:
      - deploy-orbiter
      - pin-4everland
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      # Disabled due to issue #246.
      # - name: Edgeserver Upload
      #   uses: v3xlabs/edgeserver-upload@v0.1.2-pre.4
      #   with:
      #     app_id: '422130713911889920'
      #     server: https://api.edgeserver.io
      #     token: ${{ secrets.EDGE_TOKEN }}
      #     directory: dist
      #     context: true
      # - name: Edgeserver v0.2 Upload
      #   uses: v3xlabs/edgeserver-upload@v0.2.1-pre.4
      #   with:
      #     site_id: s_305c36a033
      #     server: https://edgeserver.dev/api
      #     token: ${{ secrets.EDGE_TOKEN2 }}
      #     directory: dist
      #     context: true
      # - name: Deploy to IPFS
      #   run: ./deploy/deploy-omnipin.sh
      #   env:
      #     DEPLOY_DIRECTORY: dist
      #     OMNIPIN_FILECOIN_SP_ADDRESS: '0x32c90c26bCA6eD3945De9b29BA4e19D38314D618'
      #     OMNIPIN_FILECOIN_TOKEN: ${{ secrets.BETA_WALLETBEAT_ETH_UPDATER_EOA_PRIVATE_KEY }}
      - name: Check site data availability on IPFS gateways
        run: ./deploy/ping-gateways.sh
        env:
          DEPLOY_DIRECTORY: dist
      - name: Update beta.walletbeat.eth ENS records
        run: ./deploy/update-ens.sh
        env:
          ENS_DOMAIN: beta.walletbeat.eth
          DEPLOY_DIRECTORY: dist
          BLUMEN_PK: ${{ secrets.BETA_WALLETBEAT_ETH_UPDATER_EOA_PRIVATE_KEY }}
          OMNIPIN_PK: ${{ secrets.BETA_WALLETBEAT_ETH_UPDATER_EOA_PRIVATE_KEY }}
          BLUMEN_OR_OMNIPIN: omnipin
          SKIP_HELIOS: 'false'
