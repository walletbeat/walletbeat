name: Deploy

on:
  push:
    branches:
      - beta

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run all checks
        run: pnpm run check:ci
      - name: Clean build
        run: |
          rm -rf dist &>/dev/null || true
          pnpm build
        env:
          WALLETBEAT_ENV: CI
          WALLETBEAT_BUILD_MUST_BE_SANDBOXED: true
          WALLETBEAT_MUST_INSTALL_DEPENDENCIES_CLEANLY: true
      - name: Upload clean bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1
  pin-ipfs:
    name: Pin on IPFS
    runs-on: ubuntu-latest
    needs:
      - check
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - name: Check if website bundle contents have changed
        id: check-existing-pin
        run: ./deploy/check-existing-pin.sh
        env:
          DEPLOY_DIRECTORY: dist
          ACCESS_TOKEN_4EVERLAND: ${{ secrets.BETA_WALLBEAT_ETH_4EVERLAND_ACCESS_TOKEN }}
      - name: Deploy on IPFS
        if: steps.check-existing-pin.outputs.already-pinned != 'true'
        run: ./deploy/deploy-omnipin.sh
        env:
          DEPLOY_DIRECTORY: dist
          OMNIPIN_FILECOIN_TOKEN: ${{ secrets.BETA_WALLETBEAT_ETH_UPDATER_EOA_PRIVATE_KEY }}
      - name: Pin on 4EVERLAND
        if: steps.check-existing-pin.outputs.already-pinned != 'true'
        run: ./deploy/pin-omnipin.sh
        env:
          DEPLOY_DIRECTORY: dist
          OMNIPIN_4EVERLAND_TOKEN: ${{ secrets.BETA_WALLETBEAT_ETH_4EVERLAND_ACCESS_TOKEN }}
      - name: Check site data availability on IPFS gateways
        run: ./deploy/ping-gateways.sh
        env:
          DEPLOY_DIRECTORY: dist
  update-ens:
    name: Update ENS records
    runs-on: ubuntu-latest
    needs:
      - pin-ipfs
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - name: Check site data availability on IPFS gateways
        run: ./deploy/ping-gateways.sh
        env:
          DEPLOY_DIRECTORY: dist
      - name: Update beta.walletbeat.eth ENS records
        run: ./deploy/update-ens.sh
        env:
          ENS_DOMAIN: beta.walletbeat.eth
          DEPLOY_DIRECTORY: dist
          OMNIPIN_PK: ${{ secrets.BETA_WALLETBEAT_ETH_UPDATER_EOA_PRIVATE_KEY }}
          SKIP_HELIOS: 'false'
  unpin-old-ipfs-pins:
    name: Unpin old IPFS pins
    runs-on: ubuntu-latest
    needs:
      - update-ens
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - name: Unpin old IPFS CIDs
        run: ./deploy/unpin-old-ipfs-cids.sh
        env:
          DEPLOY_DIRECTORY: dist
          OMNIPIN_4EVERLAND_TOKEN: ${{ secrets.BETA_WALLETBEAT_ETH_4EVERLAND_ACCESS_TOKEN }}
