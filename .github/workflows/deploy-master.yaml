name: Deploy (master)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    uses: ./.github/workflows/deploy-site.yaml
    with:
      ens_domain: walletbeat.eth
    secrets:
      updater_key: ${{ secrets.WALLETBEAT_ETH_UPDATER_EOA_PRIVATE_KEY }}
      pin_token: ${{ secrets.WALLETBEAT_ETH_4EVERLAND_ACCESS_TOKEN }}
