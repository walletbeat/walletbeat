name: Update Coinspect snapshot
on:
  workflow_dispatch: {} # On demand; restore a weekly cron once a few manual runs succeed
permissions:
  contents: write
  issues: write
jobs:
  update-coinspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat deploy/debian-packages.txt)
        env:
          DEBIAN_FRONTEND: noninteractive
      - name: Refresh Coinspect snapshot
        run: ./deploy/coinspect/coinspect-update.sh
      - name: Detect snapshot changes
        id: changes
        run: |
          if git status --porcelain data/coinspect/ | grep -q .; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pnpm
        if: steps.changes.outputs.changed == 'true'
        uses: pnpm/action-setup@v6.0.9
      - name: Install Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Classify the new snapshot's checks
        id: classification
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -o pipefail
          pnpm exec tsx deploy/coinspect/check-classification.ts 2>&1 | tee "$COINSPECT_CLASSIFICATION_OUTPUT"
        env:
          COINSPECT_CLASSIFICATION_OUTPUT: ${{ runner.temp }}/coinspect-classification.txt
      - name: Audit wallet data against the new snapshot
        id: audit
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -o pipefail
          pnpm exec tsx deploy/coinspect/coinspect-audit.ts "$COINSPECT_NOTES_FILE" 2>&1 | tee "$COINSPECT_AUDIT_OUTPUT"
        env:
          COINSPECT_NOTES_FILE: ${{ runner.temp }}/coinspect-notes.md
          COINSPECT_AUDIT_OUTPUT: ${{ runner.temp }}/coinspect-audit.txt
      - name: Run all checks against the new snapshot
        id: checks
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -o pipefail
          pnpm run check:all 2>&1 | tee "$COINSPECT_CHECK_OUTPUT"
        env:
          WALLETBEAT_ENV: CI
          COINSPECT_CHECK_OUTPUT: ${{ runner.temp }}/coinspect-check-output.txt
      - name: Commit snapshot
        if: steps.changes.outputs.changed == 'true'
        run: |
          ./deploy/setup-git.sh
          ./deploy/coinspect/coinspect-push.sh
        env:
          GIT_USERNAME: walletbeat-bot
          GIT_EMAIL: walletbeat-bot@users.noreply.github.com
          GIT_REMOTE_URL: git@github.com:walletbeat/walletbeat.git
          GIT_REMOTE_BRANCH: beta
          COINSPECT_NOTES_FILE: ${{ runner.temp }}/coinspect-notes.md
          GIT_SSH_AUTHENTICATION_KEY_TYPE: ed25519
          GIT_SSH_AUTHENTICATION_KEY_PUBLIC: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILCBvEBIVY5uNBq0a1sqOKojgI/pReRR4PtDQXiWnj6U walletbeat-bot@walletbeat.eth'
          GIT_SSH_AUTHENTICATION_KEY_PRIVATE: ${{ secrets.WALLETBEAT_BOT_GIT_SSH_AUTHENTICATION_KEY_PRIVATE }}
          GIT_SSH_SIGNING_KEY_TYPE: ed25519
          GIT_SSH_SIGNING_KEY_PUBLIC: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBw+NZEg1p71wrjIngH8PZQ1GDeACirHUjposkeYdurM walletbeat-bot@walletbeat.eth'
          GIT_SSH_SIGNING_KEY_PRIVATE: ${{ secrets.WALLETBEAT_BOT_GIT_SSH_SIGNING_KEY_PRIVATE }}
      - name: Report a stuck import
        if: >-
          failure() && (steps.classification.outcome == 'failure' ||
          steps.audit.outcome == 'failure' || steps.checks.outcome == 'failure')
        run: ./deploy/coinspect/coinspect-report-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}
          COINSPECT_RESULT: >-
            ${{ steps.classification.outcome == 'failure' && 'classification' ||
            steps.audit.outcome == 'failure' && 'audit' || 'checks' }}
          COINSPECT_CLASSIFICATION_OUTPUT: ${{ runner.temp }}/coinspect-classification.txt
          COINSPECT_AUDIT_OUTPUT: ${{ runner.temp }}/coinspect-audit.txt
          COINSPECT_CHECK_OUTPUT: ${{ runner.temp }}/coinspect-check-output.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Close the import issue
        if: steps.checks.outcome == 'success'
        run: ./deploy/coinspect/coinspect-report-failure.sh
        env:
          GH_TOKEN: ${{ github.token }}
          COINSPECT_RESULT: clear
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
